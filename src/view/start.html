<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Score Smash | Début</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/bad.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<div class="row-infos">

    <label for="player1">Joueur 1</label>

    <input type="text" name="player1" id="player1" placeholder="Tapez le nom du joueur 1">

</div>

<div class="row-infos">

    <label for="player2">Joueur 2</label>

    <input type="text" name="player2" id="player2" placeholder="Tapez le nom du joueur 2">

</div>

<div class="row-infos">

    <label for="nbSets"># de jeux gagnants :</label>

    <input type="number" step="1" min="1" max="10" name="nbSets" id="nbSets" placeholder="Nombre de sets gagnant" value="2">

</div>

<div class="row-infos">

    <label for="nbPoints"># de points par set</label>

    <input type="number" step="1" min="1" max="50" name="nbPoints" id="nbPoints" placeholder="Nombre de points pour remporter le set" value="20">

</div>

<div class="row-infos">

    <label for="nbJSets"># de sets par jeu</label>

    <input type="number" step="1" min="1" max="50" name="nbJSets" id="nbJSets" placeholder="Nombre de points sets pour remporter le jeu" value="6">

</div>

<details class="more-params">

    <summary>Plus de paramètres</summary>

    <div class="row-infos check-infos">

        <label for="training">Échauffement</label>

        <input type="checkbox" name="training" id="training" checked>

    </div>

    <div class="row-infos">

        <label for="timeTrain">Temps d'échauffement (s)</label>

        <input type="number" step="1" min="0" max="600" name="timeTrain" id="timeTrain" value="40">

    </div>

    <div class="row-infos">

        <label for="pauseStart">Pause début de match (s)</label>

        <input type="number" step="1" min="0" max="600" name="pauseStart" id="pauseStart" value="30">

    </div>

    <div class="row-infos">

        <label for="pauseSet">Pause entre les sets (s)</label>

        <input type="number" step="1" min="0" max="600" name="pauseSet" id="pauseSet" value="45">

    </div>

    <div class="row-infos">

        <label for="pauseGame">Pause entre les jeux (s)</label>

        <input type="number" step="1" min="0" max="600" name="pauseGame" id="pauseGame" value="60">

    </div>

</details>

<button onclick="clickBtn()" class="go">

    GO

</button>

<a href="/tournoi" class="go go-tournoi">

    MODE TOURNOI

</a>

</body>
</html>
